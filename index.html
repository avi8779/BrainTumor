<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brain Tumour Classifier</title>
    <style>
      :root { --ink:#edf6ff; --muted:#8fa8c6; --surface:rgba(8,22,44,.76); --line:rgba(131,203,255,.22); --brand:#62d6ff; --violet:#a88cff; --green:#7ff4c1; }
      * { box-sizing:border-box; }
      body { min-height:100vh; min-height:100svh; overflow:auto; margin:0; padding:clamp(12px,2vw,28px); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 10% 6%,#163e70 0,transparent 30rem),radial-gradient(circle at 92% 94%,#342268 0,transparent 30rem),#030b18; }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.3; background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(142,213,255,.03) 4px); }
      .app { position:relative; width:min(1080px,100%); min-height:540px; margin:auto; overflow:hidden; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr); border:1px solid var(--line); border-radius:22px; background:var(--surface); box-shadow:0 28px 100px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.05); backdrop-filter:blur(20px); }
      .app::after { content:""; position:absolute; width:310px; height:310px; top:-185px; right:-90px; border:1px solid rgba(98,214,255,.22); border-radius:50%; box-shadow:0 0 0 28px rgba(98,214,255,.03),0 0 0 56px rgba(98,214,255,.025); pointer-events:none; }
      .intro { position:relative; padding:clamp(22px,3.4vw,42px); display:flex; flex-direction:column; isolation:isolate; background:linear-gradient(145deg,rgba(30,104,167,.28),rgba(33,23,82,.15)); }
      .intro::before { content:""; position:absolute; inset:22px; z-index:-1; border:1px solid rgba(142,214,255,.14); border-radius:18px; clip-path:polygon(0 0,93% 0,100% 7%,100% 100%,7% 100%,0 93%); }
      .eyebrow { margin:0; color:var(--brand); font-size:.66rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
      .scan-header { display:flex; align-items:center; justify-content:space-between; min-height:20px; margin-bottom:8px; }.status { color:var(--green); font-size:.7rem; }.status::before { content:""; display:inline-block; width:6px; height:6px; margin-right:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
      .panel { position:relative; min-width:0; padding:clamp(26px,3.5vw,46px); display:flex; flex-direction:column; justify-content:center; background:rgba(3,12,29,.42); } .panel::before { content:"ANALYSIS"; display:block; margin-bottom:14px; color:var(--brand); font-size:.66rem; font-weight:800; letter-spacing:.18em; } h2 { margin:0 0 7px; font-size:1.25rem; letter-spacing:-.03em; } .panel > p { margin:0 0 18px; color:var(--muted); font-size:.82rem; line-height:1.5; }
      form { display:grid; gap:12px; }.preview { position:relative; flex:none; height:480px; min-height:0; display:grid; place-items:center; overflow:hidden; border:1px solid #42678d; border-radius:16px; background:#050b14; box-shadow:inset 0 0 0 5px rgba(98,214,255,.035); color:var(--muted); cursor:pointer; transition:border-color .25s,box-shadow .25s; }.preview:hover { border-color:var(--brand); box-shadow:inset 0 0 0 5px rgba(98,214,255,.07),0 0 22px rgba(98,214,255,.1); }.preview::before,.preview::after { content:""; position:absolute; width:26px; height:26px; z-index:2; pointer-events:none; }.preview::before { left:11px; top:11px; border-left:2px solid var(--brand); border-top:2px solid var(--brand); }.preview::after { right:11px; bottom:11px; border-right:2px solid var(--brand); border-bottom:2px solid var(--brand); }.preview img { width:100%; height:100%; object-fit:contain; object-position:center; background:#050505; filter:contrast(1.05); }
      .scanner { position:absolute; inset:0; z-index:1; display:none; pointer-events:none; overflow:hidden; background:linear-gradient(90deg,rgba(98,214,255,.10) 1px,transparent 1px),linear-gradient(rgba(98,214,255,.08) 1px,transparent 1px); background-size:26px 26px; animation:grid-drift 3s linear infinite; }
      .scanner::before { content:""; position:absolute; inset:0 0 auto; height:3px; background:#b4edff; box-shadow:0 0 12px #62d6ff,0 0 34px rgba(98,214,255,.8); animation:scan 2.25s cubic-bezier(.45,0,.55,1) infinite; }.scanner::after { content:"LIVE SCAN // NEURAL MAPPING"; position:absolute; top:16px; right:16px; color:#d1f4ff; font-size:.62rem; font-weight:800; letter-spacing:.15em; text-shadow:0 1px 8px #06101f; }
      .preview.is-scanning { border-color:var(--brand); box-shadow:inset 0 0 32px rgba(98,214,255,.23),0 0 28px rgba(98,214,255,.12); }.preview.is-scanning .scanner { display:block; }
      @keyframes scan { 0%,100% { transform:translateY(0); opacity:.45; } 48%,52% { transform:translateY(320px); opacity:1; } } @keyframes grid-drift { to { background-position:26px 26px; } }
      input { position:absolute; inline-size:1px; block-size:1px; opacity:0; } #file-name { min-height:20px; overflow:hidden; color:var(--muted); font-size:.84rem; text-overflow:ellipsis; white-space:nowrap; }
      button { min-height:54px; border:0; border-radius:10px; background:linear-gradient(110deg,var(--brand),var(--violet)); color:#06101f; font:inherit; font-weight:850; letter-spacing:.01em; cursor:pointer; box-shadow:0 10px 25px rgba(98,214,255,.18); transition:transform .2s,opacity .2s,box-shadow .2s; } button:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 14px 32px rgba(98,214,255,.3); } button:disabled { opacity:.65; cursor:wait; }
      .result { min-height:45px; display:grid; place-items:center; margin-top:4px; padding:10px; border-radius:10px; text-align:center; font-weight:750; text-transform:capitalize; }.loading { color:var(--brand); }.success { background:rgba(75,210,152,.15); color:#8cf3bd; }.error { background:rgba(255,112,140,.13); color:#ffb4c4; text-transform:none; }
      .progress { display:none; gap:7px; align-items:center; color:var(--muted); font-size:.78rem; letter-spacing:.03em; }.progress.is-visible { display:grid; }.progress-track { height:5px; overflow:hidden; border-radius:99px; background:rgba(174,187,215,.18); }.progress-fill { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--brand),var(--violet)); box-shadow:0 0 12px var(--brand); transition:width .55s ease; }
      @media (prefers-reduced-motion:reduce) { .scanner,.scanner::before { animation:none; }.scanner::before { top:50%; }.progress-fill { transition:none; } }
      @media (max-width:800px) { body { padding:14px; }.app { min-height:0; grid-template-columns:1fr; }.intro::before { inset:15px; }.preview { height:380px; }.panel::before { margin-bottom:12px; } }
      @media (max-width:430px) { .intro,.panel { padding:22px; }.preview { height:280px; } }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="intro"><div class="scan-header"><p class="eyebrow">Scan preview</p><span class="status">System ready</span></div><label class="preview" id="preview-box" for="image"><span id="preview-placeholder">Click here to select an MRI image</span><img id="preview" alt="Selected MRI preview" hidden><div class="scanner" aria-hidden="true"></div></label></section>
      <section class="panel">
        <h2>Brain tumour classification</h2><p>Select an MRI image. The prediction will appear here after analysis.</p>
        <form id="prediction-form">
          <input id="image" name="image" type="file" accept="image/*" required>
          <span id="file-name">No file selected</span><button type="submit">Analyse image</button>
          <div id="progress" class="progress" aria-hidden="true"><span id="progress-label">Preparing scan...</span><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div></div>
          <output id="result" class="result" aria-live="polite"></output>
        </form>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
